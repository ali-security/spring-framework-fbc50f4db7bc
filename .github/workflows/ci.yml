name: CI
on:
  workflow_dispatch:
    inputs:
      test-filter:
        description: 'Gradle test selector (e.g. ":spring-webmvc:test --tests FooTests"); empty runs the full build'
        required: false
        default: ''
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
jobs:
  ci:
    name: '${{ matrix.os.name}} | Java ${{ matrix.java.version}} | ${{ matrix.modules.name }}'
    runs-on: ${{ matrix.os.id }}
    timeout-minutes: 50
    strategy:
      fail-fast: false
      matrix:
        os:
          - id: ubuntu-latest
            name: Linux
        java:
          - version: 8
            toolchain: false
        modules:
          - name: webmvc
            artifact: true
            tasks: ':spring-webmvc:build'
          - name: web
            tasks: ':spring-web:build'
          - name: webflux
            tasks: ':spring-webflux:build'
          - name: core
            tasks: ':spring-core:build :spring-jcl:build :spring-instrument:build'
          - name: beans-context
            tasks: ':spring-beans:build :spring-aop:build :spring-aspects:build :spring-expression:build :spring-context:build :spring-context-indexer:build :spring-context-support:build'
          - name: data
            tasks: ':spring-tx:build :spring-jdbc:build :spring-orm:build :spring-oxm:build :spring-r2dbc:build :spring-jms:build'
          - name: messaging
            tasks: ':spring-messaging:build :spring-websocket:build'
          - name: test
            tasks: ':spring-test:build :integration-tests:build :framework-bom:build'
    steps:
      - name: Prepare Windows runner
        if: ${{ runner.os == 'Windows' }}
        run: |
          git config --global core.autocrlf true
          git config --global core.longPaths true
          Stop-Service -name Docker
      - name: Check Out Code
        uses: actions/checkout@v4
      - name: Select Gradle Tasks
        id: tasks
        shell: bash
        run: |
          if [ -n "${{ inputs.test-filter }}" ]; then
            if [ "${{ matrix.modules.artifact }}" = "true" ]; then
              tasks=":spring-webmvc:jar ${{ inputs.test-filter }}"
            else
              tasks="help"
            fi
          else
            tasks="${{ matrix.modules.tasks }}"
          fi
          echo "Gradle tasks: $tasks"
          echo "tasks=$tasks --continue --no-build-cache --console=plain" >> $GITHUB_OUTPUT
      - name: Build
        id: build
        uses: ./.github/actions/build
        with:
          publish: true
          tasks: ${{ steps.tasks.outputs.tasks }}
          java-version: ${{ matrix.java.version }}
          java-early-access: ${{ matrix.java.early-access || 'false' }}
          java-toolchain: ${{ matrix.java.toolchain }}
          develocity-access-key: ${{ secrets.GRADLE_ENTERPRISE_SECRET_ACCESS_KEY }}
      - name: Test Report
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          python3 - <<'PYEOF'
          import glob, os, re
          import xml.etree.ElementTree as ET

          def src_file(module, classname):
              outer = classname.split('$')[0]
              rel = outer.replace('.', '/')
              for root in ('src/test/java', 'src/test/kotlin', 'src/testFixtures/java'):
                  for ext in ('.java', '.kt'):
                      p = os.path.join(module, root, rel + ext)
                      if os.path.exists(p):
                          return p
              for p in glob.glob('*/src/test/*/' + rel + '.*'):
                  return p
              return None

          ANN = re.compile(r'@(Disabled\w*|Enabled\w*|Ignore|Assume\w*|Requires\w*|IfProfileValue)\b.*')
          CLASSDECL = re.compile(r'^((public|protected|private|abstract|final|static|open|internal)\s+)*(class|interface)\s+\w+')
          ASSUME = re.compile(r'(assume\w*|Assumptions\.\w+|Assume\.\w+)\s*\(')

          def method_name(name):
              n = re.sub(r'\[[^\]]*\]$', '', name).strip()
              n = re.sub(r'\([^)]*\)$', '', n).strip()
              return n.strip('`')

          def reason_in(path, mname, depth=0):
              if not path or depth > 4:
                  return None
              lines = open(path, encoding='utf-8', errors='replace').read().split('\n')
              text = '\n'.join(lines)
              decl = re.compile(r'(void|fun)\s+`?' + re.escape(mname) + r'`?\s*\(')
              for i, line in enumerate(lines):
                  if decl.search(line):
                      for j in range(i - 1, max(-1, i - 12), -1):
                          s = lines[j].strip()
                          m = ANN.search(s)
                          if m:
                              return 'method annotation ' + m.group(0)
                          if s.endswith('}') or s.endswith(';'):
                              break
                      body = '\n'.join(lines[i:i + 40])
                      m = ASSUME.search(body)
                      if m:
                          start = m.start()
                          return 'assumption ' + ' '.join(body[start:start + 200].split()).split(';')[0]
                      break
              for line in lines:
                  s = line.strip()
                  if s.startswith('*') or s.startswith('/') :
                      continue
                  if CLASSDECL.search(s):
                      break
                  m = ANN.search(s)
                  if m:
                      return 'class annotation ' + m.group(0)
              for line in lines:
                  m = ASSUME.search(line)
                  if m:
                      return 'assumption in class setup: ' + ' '.join(line.split())
              m = re.search(r'\bextends\s+(\w+)', text)
              if m:
                  sup = m.group(1)
                  pkg = re.search(r'^package\s+([\w.]+)', text, re.M)
                  imp = re.search(r'^import\s+([\w.]+\.' + sup + r');', text, re.M)
                  fq = imp.group(1) if imp else ((pkg.group(1) + '.' + sup) if pkg else sup)
                  module = path.split('/')[0]
                  return reason_in(src_file(module, fq), mname, depth + 1)
              return None

          total = {'tests': 0, 'passed': 0, 'failed': 0, 'skipped': 0}
          for module in sorted({p.split('/')[0] for p in glob.glob('*/build/test-results/test/TEST-*.xml')}):
              t = f = s = 0
              skips, fails = {}, []
              for x in sorted(glob.glob(module + '/build/test-results/test/TEST-*.xml')):
                  root = ET.parse(x).getroot()
                  for tc in root.iter('testcase'):
                      t += 1
                      cls, name = tc.get('classname'), tc.get('name')
                      if tc.find('skipped') is not None:
                          s += 1
                          msg = (tc.find('skipped').get('message') or '').strip()
                          if not msg:
                              msg = reason_in(src_file(module, cls), method_name(name)) or 'disabled by a JUnit condition with no message'
                          if 'TestGroups(LONG_RUNNING)' in msg or 'TestGroups(PERFORMANCE)' in msg:
                              msg += ' [opt-in test group, enabled only via -PtestGroups; the default upstream build leaves it off]'
                          skips.setdefault((cls, msg), []).append(name)
                      elif tc.find('failure') is not None or tc.find('error') is not None:
                          f += 1
                          el = tc.find('failure') if tc.find('failure') is not None else tc.find('error')
                          fails.append(f'FAILED TEST {cls} > {name}\n{(el.text or el.get("message") or "")[:4000]}')
              p = t - f - s
              print(f'TEST SUMMARY [{module}]: {t} tests, {p} passed, {f} failed, {s} skipped')
              for (cls, msg), names in skips.items():
                  print(f'  SKIPPED TESTS ({len(names)}) {cls} > {", ".join(names)} -- reason: {msg}')
              for line in fails:
                  print('  ' + line)
              total['tests'] += t; total['passed'] += p; total['failed'] += f; total['skipped'] += s
          print(f"TEST SUMMARY [TOTAL]: {total['tests']} tests, {total['passed']} passed, {total['failed']} failed, {total['skipped']} skipped")
          PYEOF
      - name: Upload JAR artifact
        if: ${{ matrix.modules.artifact }}
        uses: actions/upload-artifact@v4
        with:
          name: spring-webmvc-jar
          if-no-files-found: error
          path: |
            spring-webmvc/build/libs/spring-webmvc-*.jar
            !spring-webmvc/build/libs/*-sources.jar
            !spring-webmvc/build/libs/*-javadoc.jar
            !spring-webmvc/build/libs/*-test-fixtures.jar
